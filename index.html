<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>SNT Huddle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Nunito+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a meeting "run sheet" for one shared screen — stage rail on the left, the stage in the middle, the team on the right.
   Palette: NSLS navy + red, with steel blue, taken from the chapter's SNT slide theme. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#E7EAEF; --ink:#13223F; --muted:#55617A; --line:#D3D9E3;
  --brand:#183059; --brand-ink:#FFFFFF; --brand2:#335F83;
  --accent:#C0181B; --accent-on:#FFFFFF; --accent-soft:#F9E3E3; --accent-ink:#8E1114;
  --band:#183059; --band-ink:#FFFFFF; --band-muted:#B7C4DB;
  --ok:#1E6B4F; --ok-soft:#DDEFE7; --warn:#A65A00; --warn-soft:#F7E9D6;
  /* Brand faces: Brandon Grotesque Bold (display, labels) and Avenir (body). Both are licensed fonts, so they render
     where installed; everyone else gets the closest Google Fonts matches, Josefin Sans and Nunito Sans. */
  --f-display:"Brandon Grotesque", "Brandon Grotesque Bold", "Josefin Sans", "Century Gothic", system-ui, sans-serif;
  --f-body:"Avenir Next", "Avenir", "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:var(--f-display);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1322; --surface:#132037; --sunk:#0F1A2D; --ink:#E8ECF4; --muted:#9DA8BE; --line:#26344F;
  --brand:#93B4E3; --brand-ink:#0B1322; --brand2:#7FA6CC;
  --accent:#E5484B; --accent-on:#FFFFFF; --accent-soft:#3A1517; --accent-ink:#F5A3A4;
  --band:#183059; --band-ink:#FFFFFF; --band-muted:#B7C4DB;
  --ok:#5CC79C; --ok-soft:#10322A; --warn:#F0A35C; --warn-soft:#3A2710; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#132037; --sunk:#0F1A2D; --ink:#E8ECF4; --muted:#9DA8BE; --line:#26344F;
  --brand:#93B4E3; --brand-ink:#0B1322; --brand2:#7FA6CC;
  --accent:#E5484B; --accent-on:#FFFFFF; --accent-soft:#3A1517; --accent-ink:#F5A3A4;
  --band:#183059; --band-ink:#FFFFFF; --band-muted:#B7C4DB;
  --ok:#5CC79C; --ok-soft:#10322A; --warn:#F0A35C; --warn-soft:#3A2710; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--brand)}
.wrap{max-width:1240px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-family:var(--f-mono);font-weight:700;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel{background:var(--sunk);border-radius:var(--r);padding:14px 16px}
label{font-weight:700;font-size:.9rem;display:block;margin-bottom:4px}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font-weight:700}
button:hover{border-color:var(--brand)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn-accent{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--brand);padding:6px 8px}
.btn-sm{padding:5px 10px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.note{border-radius:8px;padding:10px 14px;background:var(--accent-soft);color:var(--accent-ink);font-size:.92rem}
.note.info{background:var(--sunk);color:var(--ink)}
.mono{font-weight:700}

/* Full-bleed navy bands (hero, top bar) without widening the page */
.band{background:var(--band);color:var(--band-ink);box-shadow:0 0 0 100vmax var(--band);clip-path:inset(0 -100vmax)}
.band a{color:var(--band-ink)}
.band .eyebrow,.band .muted{color:var(--band-muted)}
.wordmark{display:flex;align-items:center;gap:12px}
.wordmark b{font-family:var(--f-display);font-weight:700;font-size:1.7rem;letter-spacing:.06em;line-height:1;padding-right:12px;border-right:3px solid var(--accent)}
.wordmark span{font-size:.8rem;line-height:1.35;color:var(--band-muted)}
.redrule{height:4px;background:var(--accent);box-shadow:0 0 0 100vmax var(--accent);clip-path:inset(0 -100vmax)}

/* Home */
.hero{padding-block:30px 32px;display:grid;gap:20px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:end}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero p.lede{font-size:1.12rem;max-width:58ch;margin-top:12px;color:var(--band-ink);opacity:.92}
.path{display:flex;gap:0;flex-wrap:wrap;margin-top:6px}
.path span{font-family:var(--f-mono);font-weight:700;font-size:.78rem;padding:5px 10px;border:1px solid var(--band-muted);margin:-1px 0 0 -1px;color:var(--band-ink)}
.path span:last-child{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:700}
.home-body{padding-top:24px}
.meetings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.mtg{position:relative;display:block;cursor:pointer;margin:0}
.mtg input{position:absolute;opacity:0}
.mtg .card{height:100%;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.mtg input:checked + .card{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.mtg input:focus-visible + .card{outline:3px solid var(--accent);outline-offset:2px}
.mtg .num{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;color:var(--accent)}
.homegrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.namechips{display:flex;flex-wrap:wrap;gap:8px}
.namechips span{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--sunk);font-weight:700}
.namechips button{padding:0 8px;border:0;background:transparent;color:var(--muted)}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Meeting view */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:10px;border-bottom:3px solid var(--accent)}
.topbar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.topbar .brandname{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.15rem}
.topbar .brandname b{font-weight:700;letter-spacing:.06em;padding-right:10px;border-right:2px solid var(--accent)}
.topbar button{background:transparent;color:var(--band-ink);border-color:var(--band-muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 270px;gap:20px;margin-top:20px;align-items:start}
@media (max-width:1080px){.layout{grid-template-columns:minmax(0,1fr) 260px}.rail{grid-column:1 / -1}}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
@media (max-width:1080px){.rail ol{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.rail button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border-color:transparent;background:transparent;font-weight:700;white-space:nowrap}
.rail button .n{font-family:var(--f-mono);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:.8rem;flex:none}
.rail button.viewing{background:var(--surface);border-color:var(--line)}
.rail button.viewing .n{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.stagehead{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin-bottom:18px}
.steps3 div{border-top:3px solid var(--brand2);padding-top:8px}
.steps3 b{display:block;font-family:var(--f-display)}
.roster{display:flex;flex-direction:column;gap:12px}
.member{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.member:first-of-type{border-top:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;color:#fff}
.member .who{min-width:0;flex:1}
.member .who b{display:block;overflow-wrap:anywhere}
.roles{display:grid;gap:8px}
.role{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.role small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard header{display:flex;gap:10px;align-items:center}
.ro{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.smart{display:grid;gap:8px}
.smart .l{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.smart .letter{font-family:var(--f-display);font-weight:700;font-size:1.3rem;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--brand);color:var(--brand-ink)}
.spot{border:2px solid var(--brand2);border-top:4px solid var(--accent)}
.timer{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:2.6rem;font-weight:700;line-height:1}
.tbar{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.tbar i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:6px}
.tbar.zone i{background:var(--warn)}
.tbar.over i{background:var(--accent)}
.tbar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35}
.tlabels{position:relative;height:16px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.tlabels span{position:absolute;transform:translateX(-50%)}
.fb{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.fb li{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.92rem;overflow-wrap:anywhere}
.fb li .chip{margin-right:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{margin:0;font-weight:700;font-size:.85rem;display:inline-flex}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface)}
.seg input:checked + span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.statusgrid label{margin:0;font-weight:400;cursor:pointer}
.statusgrid input{position:absolute;opacity:0}
.statusgrid .card{padding:10px 12px;height:100%}
.statusgrid input:checked + .card{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.statusgrid input:focus-visible + .card{outline:3px solid var(--accent)}
.starter{font-family:var(--f-display);font-size:1.45rem;font-weight:700;line-height:1.25}
.steplist{display:flex;flex-direction:column;gap:8px}
.stepitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.stepitem input[type=checkbox]{width:18px;height:18px}
.portal ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.portal li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.portal li.done{background:var(--ok-soft);border-color:transparent}
.portal li input{width:20px;height:20px;margin-top:2px}
.path-ui{font-family:var(--f-mono);font-weight:700;font-size:.82rem;background:var(--sunk);padding:2px 6px;border-radius:4px;white-space:nowrap}
.redbtn{font-family:var(--f-mono);font-weight:700;font-size:.8rem;background:var(--accent);color:var(--accent-on);padding:2px 8px;border-radius:4px}
.q{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.q .qh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.q .qh b{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.06em}
.linkbtn{display:inline-block;text-align:center;text-decoration:none;padding:10px 14px;border-radius:8px;font-weight:700}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;z-index:20;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" class="wrap"></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------- Content from the SUNY Oneonta SNT Program Guide & session deck ---------- */
const MEETINGS = {
  1:{title:"Foundations & Goal Setting", sub:"Get to know your team and draft your first SMART Goal."},
  2:{title:"Accountability & Momentum", sub:"Check in on progress and support teammates who need a boost."},
  3:{title:"Reflection & Celebration", sub:"Close the loop on your goals and decide what comes next."}
};
const STAGES = ["Kickoff","Discussion","Action steps","Wrap-up","Submit in Members Area"];
const ROLES = [
  {key:"facilitator",label:"Facilitator",does:"Starts the meeting, states the day’s goal, holds the group accountable. Usually shares their screen."},
  {key:"timekeeper",label:"Timekeeper",does:"Keeps the meeting on schedule so every voice gets heard."},
  {key:"recorder",label:"Recorder",does:"Documents action steps and sends the team a meeting summary."}
];
const STARTERS = {
  "General / Easy":["How has your day been so far?","What’s something that made you smile recently?","What’s your favorite way to spend a weekend?","What’s a hobby you’re really enjoying right now?","Have you read or watched anything interesting lately?"],
  "Random":["What was the last fun video you saw?","What do you do to get rid of stress?","What is something you’re obsessed with?","What three words best describe you?","What would be your perfect weekend?","What’s the most useful thing you own?","What’s your favorite way to waste time?","What is something popular now that annoys you?"],
  "Goals":["What personal goals do you have?","What are your goals for the next two years?","What do you do to maintain motivation?","What’s the craziest, most outrageous thing you want to achieve?","How have your goals changed over your life?","What inspires you?","What do you hope to achieve post-graduation?","Do you usually achieve the goals you set? Why or why not?"],
  "Networking":["What’s the most interesting thing you’re working on currently?","What got you into your major? What inspired you?","What trends in your major excite you the most, and why?","If you could change one thing about your major, what would it be and why?"],
  "Light, Fun & Quirky":["What’s your favorite midnight snack?","What’s a weird food combo you enjoy?","What’s your favorite dad joke?","What kitchen appliance best represents you? Why?"]
};
const STATUSES = [
  {key:"completed",label:"Completed",sym:"👍",d:"Finished every action step and ready to celebrate the win."},
  {key:"progress",label:"Making progress",sym:"👍",d:"Finished most steps; looking for a quick gut-check before moving on."},
  {key:"boost",label:"Need a boost",sym:"👎",d:"Ran out of time and could use a revised, more realistic plan."},
  {key:"life",label:"Life got in the way",sym:"👎",d:"Be honest about it instead of glossing over it."}
];
const SMART = [
  ["S","Specific","What exactly will I do?"],
  ["M","Measurable","How will I know I’ve done it?"],
  ["A","Attainable","Can I realistically achieve this?"],
  ["R","Relevant","Why does this goal matter to me?"],
  ["T","Time-bound","When will this be complete?"]
];
const FB_TAGS = ["Is it SMART?","Connection","Advice","Resource","Encouragement"];
const PORTAL_URL = "https://app.nsls.org";
const CHAPTER_EMAIL = "nsls@oneonta.edu";
const STORE_KEY = "snt-huddle-meeting";
/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AV_COLORS = ["#183059","#C0181B","#335F83","#546F6B","#7A2E5C","#2E6B4F","#8A5A12","#4B4FA0"];
function avColor(id){ let h = 0; for (const c of String(id)) h = (h*31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
const initials = n => (String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2) || "?").toUpperCase();
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=> t.hidden = true, 2200); }
const newId = () => "m" + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36);

/* ---------- State: one meeting, kept on this device ---------- */
const app = { m:null, homeMeeting:1, draftNames:[], actingAs:null, confirmReset:false, error:"" };
function newMember(name){
  return {id:newId(), name, year:"", hometown:"", why:"", high:"", low:"", status:"",
    goalType:"", longTerm:"", S:"", M:"", A:"", R:"", T:"", goal:"",
    progress:"", progressDone:"", progressChallenges:"", steps:[{t:"",done:false}],
    rSteps:null, impact:"", recommit:false, submitted:false};
}
function startMeeting(){
  const members = app.draftNames.map(newMember);
  app.m = {meeting:app.homeMeeting, stage:0, roles:{facilitator:null,timekeeper:null,recorder:null}, starter:null,
    spotlight:{uid:null, runningSince:null, elapsedBefore:0}, next:"", order:members.map(x=>x.id),
    members:Object.fromEntries(members.map(x=>[x.id,x])), feedback:[], ticks:{}};
  app.actingAs = app.m.order[0]; app.draftNames = [];
  save(); render(); window.scrollTo({top:0});
}
function save(){ if (app.m) ls.set(STORE_KEY, app.m); }
function endMeeting(){ ls.del(STORE_KEY); app.m = null; app.confirmReset = false; render(); window.scrollTo({top:0}); }
function patchMember(id, patch, rerender){ Object.assign(app.m.members[id], patch); save(); if (rerender) scheduleRender(); }
function patchMeeting(patch, rerender){ Object.assign(app.m, patch); save(); if (rerender) scheduleRender(); }
const ids = () => app.m.order.filter(id => app.m.members[id]);
const mName = id => (app.m.members[id] && app.m.members[id].name) || "Member";
function roleOf(id){ return ROLES.filter(x => app.m.roles[x.key] === id).map(x => x.label); }

/* ---------- Rendering ---------- */
let rq = 0;
function scheduleRender(){ if (!rq) rq = requestAnimationFrame(()=>{ rq = 0; render(); }); }
function render(){
  const a = document.activeElement; const fid = a && a.id; let ss, se;
  try { ss = a.selectionStart; se = a.selectionEnd; } catch {}
  $("#app").innerHTML = app.m ? meetingView() : homeView();
  if (fid){ const el = document.getElementById(fid); if (el && el !== document.activeElement){ el.focus({preventScroll:true}); try { if (ss != null) el.setSelectionRange(ss, se); } catch {} } }
  tick();
}

function homeView(){
  const m = app.homeMeeting;
  const mcards = [1,2,3].map(n => `
    <label class="mtg"><input type="radio" name="hm" id="hm${n}" value="${n}" ${m===n?"checked":""}>
      <div class="card"><span class="num">${n}</span><b>${esc(MEETINGS[n].title)}</b><span class="muted small">${esc(MEETINGS[n].sub)}</span></div></label>`).join("");
  return `
  <section class="hero band">
    <div>
      <div class="wordmark"><b>NSLS</b><span>The National Society of Leadership &amp; Success<br>SUNY Oneonta Chapter</span></div>

      <input type="text" id="st-${id}-${i}" data-step="${id}|${i}|t" value="${esc(s.t)}" placeholder="Step ${i+1}: a concrete task before next meeting" aria-label="Step ${i+1}">
      <button class="btn-ghost btn-sm" data-act="stepdel" data-arg="${id}|${i}" aria-label="Remove step ${i+1}">✕</button></div>`).join("")}
    <div><button class="btn-sm" data-act="stepadd" data-arg="${id}">+ Add a step</button></div></div>`;
}
const stepsText = m => (m.steps||[]).filter(s => s.t).map((s,i) => `${i+1}. ${s.t}`).join("\n");
function summaryText(){
  const t = app.m; const lines = [`NSLS Success Networking Team · Meeting ${t.meeting}: ${MEETINGS[t.meeting].title}`];
  lines.push(`Roles: ${ROLES.map(x => `${x.label} – ${t.roles[x.key] ? mName(t.roles[x.key]) : "open"}`).join("; ")}`, "");
  ids().forEach(id => {
    const m = t.members[id]; lines.push(m.name);
    if (m.goal) lines.push(`  Goal: ${m.goal}`);
    const st = (m.steps||[]).filter(s => s.t);
    st.forEach((s,i) => lines.push(`  ${i+1}. ${s.t}`));
    if (!m.goal && !st.length) lines.push("  (nothing recorded)");
  });
  if (t.next) lines.push("", `Next meeting: ${t.next}`);
  lines.push("", `Reminder: each member submits their own SNT Report in the NSLS Members Area (app.nsls.org). Questions: ${CHAPTER_EMAIL}`);
  return lines.join("\n");
}

/* --- Submit: bridge to the Members Area --- */
function reportQs(m){
  const mt = app.m.meeting; const qs = [];
  if (mt !== 1) qs.push({k:"PROGRESS", q:"Did you succeed in achieving your action steps since the last meeting?", progress:true});
  qs.push({k:"SMART GOAL", q:"Please state your goal using the SMART method.", f:"goal"});
  qs.push({k:"ACTION STEPS", q:"Please list the action steps you will take to achieve your goal as stated above.", f:"rSteps", val: m.rSteps ?? stepsText(m)});
  qs.push({k:"IMPACT", q:"How have the NSLS speakers or SNT meetings helped you achieve your goals or changed your life?", f:"impact", tip: mt===1 ? "In the first meeting, focus on how you have achieved your goals in the past." : ""});
  return qs;
}
const progressAnswer = m => m.progress === "yes" ? (m.progressDone || "") : m.progress === "no" ? (m.progressChallenges || "") : "";
function allAnswers(m){
  const out = [`SNT Report answers for ${m.name}`, `Meeting: Meeting ${app.m.meeting}`, `Date of meeting: enter the date of this session`];
  reportQs(m).forEach(q => {
    if (q.progress) out.push(`PROGRESS: ${m.progress ? (m.progress==="yes"?"Yes":"No") : ""}\n${progressAnswer(m)}`);
    else out.push(`${q.k}:\n${q.val ?? m[q.f] ?? ""}`);
  });
  out.push(`Submit at ${PORTAL_URL}: Courses → Foundations of Leadership → SNTs → Submit New SNT Report.`);
  return out.join("\n\n");
}
function submitView(){
  const t = app.m; if (!t.members[app.actingAs]) app.actingAs = ids()[0];
  const id = app.actingAs; const m = t.members[id];
  if (!m) return stageHead("Bridge to the NSLS Members Area","Submit your SNT Report","") + `<p class="note">Add a teammate to draft a report.</p>`;
  const qs = reportQs(m);
  const filled = qs.filter(q => q.progress ? (m.progress && progressAnswer(m)) : String(q.val ?? m[q.f] ?? "").trim()).length;
  const qHtml = qs.map(q => {
    if (q.progress){
      const f = m.progress === "no" ? "progressChallenges" : "progressDone";
      const lbl = m.progress === "no" ? "If NO, please explain the challenges that you experienced." : "If YES, please state which action steps you were able to complete.";
      return `<div class="q"><div class="qh"><b>PROGRESS</b>${m.progress && progressAnswer(m)?'<span class="chip ok">ready</span>':'<span class="chip">to do</span>'}</div><p>${esc(q.q)}</p>
        <div class="seg">${[["yes","Yes"],["no","No"]].map(([v,l]) => `<label><input type="radio" name="rp-${id}" id="rp-${id}-${v}" data-mf="${id}|progress" value="${v}" ${m.progress===v?"checked":""}><span>${l}</span></label>`).join("")}</div>
        ${m.progress ? `<label for="rq-${f}">${esc(lbl)}</label><textarea id="rq-${f}" data-mf="${id}|${f}" rows="3">${esc(m[f]||"")}</textarea>
        <div><button class="btn-sm" data-act="copyel" data-arg="rq-${f}">Copy answer</button></div>` : ""}</div>`;
    }
    const v = q.val ?? m[q.f] ?? ""; const elid = `rq-${q.f}`;
    return `<div class="q"><div class="qh"><b>${esc(q.k)}</b>${String(v).trim()?'<span class="chip ok">ready</span>':'<span class="chip">to do</span>'}</div>
      <label for="${elid}" style="font-weight:400">${esc(q.q)}${q.tip?` <span class="hint">${esc(q.tip)}</span>`:""}</label>
      <textarea id="${elid}" data-mf="${id}|${q.f}" rows="4">${esc(v)}</textarea>
      <div class="row"><button class="btn-sm" data-act="copyel" data-arg="${elid}">Copy answer</button>
      ${q.f==="rSteps" && m.rSteps != null ? `<button class="btn-ghost btn-sm" data-act="resetsteps" data-arg="${id}">Refill from action steps</button>` : ""}
      ${q.f==="goal" && !v ? `<button class="btn-ghost btn-sm" data-act="compose" data-arg="${id}">Build from S-M-A-R-T notes</button>` : ""}</div></div>`;
  }).join("");
  const ticks = t.ticks[id] || {};
  const P = [
    `Open the NSLS Members Area at <a href="${PORTAL_URL}" target="_blank" rel="noopener">app.nsls.org</a>.`,
    `Sign in with your Member ID email and password.`,
    `On the blue sidebar, click <span class="path-ui">COURSES</span> → <span class="path-ui">FOUNDATIONS OF LEADERSHIP</span> → <span class="path-ui">SNTs</span>.`,
    `On the top navigation bar, click <span class="path-ui">SUBMIT NEW SNT REPORT</span>.`,
    `Select which meeting you’re reporting: <b>Meeting ${esc(t.meeting)}</b>.`,
    `Fill in <b>Date of Meeting</b>. It must match the date of the SNT session you attended.`,
    `Paste each answer into the matching question.`,
    `Click the red <span class="redbtn">SUBMIT</span> button.`
  ];
  const doneCount = P.filter((_,i) => ticks[i]).length;
  const subCount = ids().filter(x => t.members[x].submitted).length;
  return stageHead("Bridge to the NSLS Members Area","Submit your SNT Reports", `Each member files their own report in the Members Area. That’s the only place credit is granted. Pick a teammate, review the answers drafted from today’s meeting, and copy them into the chat for that person. Then walk through the submission steps together.`) +
  `<div class="panel row"><label for="acting" style="margin:0">Report answers for</label>
     <select id="acting" data-acting="1" style="width:auto">${ids().map(x=>`<option value="${x}" ${x===id?"selected":""}>${esc(mName(x))}${t.members[x].submitted?" ✓":""}</option>`).join("")}</select></div>
  <div class="grid2" style="margin-top:14px;align-items:start">
    <div class="card">
      <div class="row" style="justify-content:space-between"><h3>${esc(m.name)}’s report draft</h3><span class="chip ${filled===qs.length?"ok":""}">${filled} of ${qs.length} ready</span></div>
      ${qHtml}
      <div class="stack" style="padding-top:12px;border-top:1px solid var(--line);gap:6px"><div><button class="btn-primary" data-act="copyall">Copy all of ${esc(m.name)}’s answers</button></div>
      <p class="small muted">Paste them into the call chat or a direct message so ${esc(m.name)} has them when they open the Members Area.</p></div>
    </div>
    <div class="stack">
      <div class="card stack portal">
        <div class="row" style="justify-content:space-between"><h3>Submit in the Members Area</h3><span class="chip ${doneCount===P.length?"ok":""}">${doneCount}/${P.length}</span></div>
        <ol>${P.map((p,i) => `<li class="${ticks[i]?"done":""}"><input type="checkbox" id="pt-${i}" data-tick="${i}" ${ticks[i]?"checked":""} aria-label="Step ${i+1} done"><span>${p}</span></li>`).join("")}</ol>
        <a class="btn-accent linkbtn" href="${PORTAL_URL}" target="_blank" rel="noopener">Open the Members Area ↗</a>
      </div>
      <div class="card stack">
        <h3>Submitted?</h3>
        ${m.submitted ? `<p class="note info"><b>${esc(m.name)} is marked as submitted.</b></p>` : `<p class="muted small">Once ${esc(m.name)} clicks SUBMIT in the Members Area, mark it here.</p>`}
        <div><button class="${m.submitted?"":"btn-primary"}" data-act="submitted" data-arg="${id}">${m.submitted ? "Undo: not submitted yet" : `${esc(m.name)} submitted`}</button></div>
        <p class="small muted">${subCount} of ${ids().length} teammates have submitted.</p>
      </div>
      <div class="panel small stack" style="gap:6px">
        <b>What happens next</b>
        <p>Within 72 business hours each report is approved or denied.</p>
        <p>If it’s denied, you’ll get an email with the reason and suggestions to improve it before you resubmit.</p>
        <p>No approval or denial after 72 hours? Email us at <b class="mono">${CHAPTER_EMAIL}</b> and we’ll look into it.</p>
        ${t.meeting===3 ? "<p><b>Also:</b> watch at least 3 Speaker Broadcasts to finish Induction.</p>" : ""}
      </div>
    </div>
  </div>`;
}

/* --- Roster --- */
function rosterView(){
  const list = ids();
  return `<div class="card">
    <div class="row" style="justify-content:space-between"><h3>Your team</h3><span class="small muted">${list.length} ${list.length===1?"member":"members"}</span></div>
    <div style="margin-top:8px">${list.map(id => { const m = app.m.members[id];
      return `<div class="member">${avatar(id)}<div class="who"><b>${esc(m.name)}</b>
        <div class="row" style="gap:4px;margin-top:3px">${roleOf(id).map(r=>`<span class="chip acc">${esc(r)}</span>`).join("")}
        ${m.submitted ? '<span class="chip ok">Report submitted</span>' : '<span class="chip">Report pending</span>'}</div></div>
        <button class="btn-ghost btn-sm" data-act="rmmember" data-arg="${id}" aria-label="Remove ${esc(m.name)}">✕</button></div>`; }).join("")}</div>
    <div class="row" style="margin-top:10px;gap:6px"><input type="text" id="addname" placeholder="Add a teammate" style="flex:1;min-width:120px" autocomplete="off"><button class="btn-sm" data-act="addmember">Add</button></div>
  </div>
  ${app.m.next ? `<div class="card small"><span class="eyebrow">Next meeting</span><p style="margin-top:4px">${esc(app.m.next)}</p></div>` : ""}
  <div class="panel small stack" style="gap:6px"><b>Every SNT meeting</b><span>Kickoff → Discussion → Wrap-up. Each member submits their report in the NSLS Members Area afterward.</span>
  <span>Questions: <b class="mono">${CHAPTER_EMAIL}</b></span></div>`;
}

/* ---------- Timer ---------- */
const elapsed = sp => (sp.elapsedBefore||0) + (sp.runningSince ? Math.max(0,(Date.now() - sp.runningSince)/1000) : 0);
function tick(){
  const el = document.querySelector(".js-timer"); if (!el || !app.m) return;
  const s = elapsed(app.m.spotlight);
  el.textContent = `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  const bar = document.querySelector(".js-tbar");
  bar.querySelector("i").style.width = Math.min(100, s/600*100) + "%";
  bar.classList.toggle("zone", s >= 420 && s < 540); bar.classList.toggle("over", s >= 540);
  document.querySelector(".js-tmsg").textContent = s >= 540 ? "Past 9 minutes. Time to wrap up and pass the spotlight." : s >= 420 ? "In the 7–9 minute window. Start wrapping up." : "About 7–9 minutes per member.";
}
setInterval(tick, 500);
function setSpot(patch){ patchMeeting({spotlight:Object.assign({}, app.m.spotlight, patch)}, true); }

/* ---------- Events ---------- */
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.mf && el.type !== "radio" && el.type !== "checkbox"){ const [id,f] = el.dataset.mf.split("|"); patchMember(id, {[f]: el.value}); }
  else if (el.dataset.step && el.type !== "checkbox") editStep(el.dataset.step, el.value, false);
  else if (el.dataset.next) patchMeeting({next: el.value});
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.mf){ const [id,f] = el.dataset.mf.split("|"); patchMember(id, {[f]: el.type === "checkbox" ? el.checked : el.value}, true); }
  else if (el.dataset.step) editStep(el.dataset.step, el.type === "checkbox" ? el.checked : el.value, true);
  else if (el.dataset.role) patchMeeting({roles:Object.assign({}, app.m.roles, {[el.dataset.role]: el.value || null})}, true);
  else if (el.dataset.spot) setSpot({uid: el.value || null, runningSince:null, elapsedBefore:0});
  else if (el.dataset.acting){ app.actingAs = el.value; render(); }
  else if (el.dataset.next) scheduleRender();
  else if (el.dataset.tick != null){ const tk = app.m.ticks[app.actingAs] || (app.m.ticks[app.actingAs] = {}); tk[el.dataset.tick] = el.checked; save(); render(); }
  else if (el.name === "hm"){ app.homeMeeting = Number(el.value); render(); }
});
function editStep(spec, v, rerender){
  const [id, i, f] = spec.split("|"); const m = app.m.members[id];
  const steps = (m.steps && m.steps.length ? m.steps : [{t:"",done:false}]).map(s => Object.assign({}, s));
  steps[Number(i)][f] = v; patchMember(id, {steps}, rerender);
}
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const id = e.target.id || "";
  if (id === "h-name"){ e.preventDefault(); act("addname"); }
  else if (id === "addname"){ e.preventDefault(); act("addmember"); }
  else if (id.startsWith("fb-") && id.endsWith("-text")){ e.preventDefault(); act("fbadd", id.slice(3, -5)); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (b) act(b.dataset.act, b.dataset.arg);
});
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { toast("Select the text and press Ctrl+C (⌘C on Mac)"); }
}
function act(a, arg){
  switch(a){
    case "addname": { const inp = $("#h-name"); const n = inp.value.trim(); if (!n) return; app.draftNames.push(n.slice(0,60)); app.error = ""; render(); $("#h-name").focus(); return; }
    case "dropname": app.draftNames.splice(Number(arg),1); render(); return;
    case "start": { const inp = $("#h-name"); if (inp && inp.value.trim()) app.draftNames.push(inp.value.trim().slice(0,60)); if (!app.draftNames.length){ app.error = "Add at least one teammate to start."; render(); return; } startMeeting(); return; }
    case "end": app.confirmReset = true; render(); return;
    case "endno": app.confirmReset = false; render(); return;
    case "endyes": endMeeting(); return;
    case "go": patchMeeting({stage:Number(arg)}, false); render(); window.scrollTo({top:0}); return;
    case "draw": { const list = STARTERS[arg]; let i = Math.floor(Math.random()*list.length);
      const cur = app.m.starter; if (cur && cur.cat === arg && cur.i === i) i = (i+1) % list.length;
      patchMeeting({starter:{cat:arg, i}}, true); return; }
    case "compose": { const m = app.m.members[arg]; const parts = [];
      if (m.S) parts.push(`I will ${m.S.replace(/^i will\s+/i,"")}`); if (m.M) parts.push(`measured by ${m.M}`); if (m.T) parts.push(`by ${m.T}`);
      let s = parts.join(", "); if (m.R) s += `${s?", ":""}because ${m.R}`; s = s ? s.replace(/\.*$/,".") : "";
      if (!s){ toast("Fill in the S, M and T lines first"); return; }
      patchMember(arg, {goal:s}, true); return; }
    case "tstart": { const sp = app.m.spotlight; if (sp.runningSince) setSpot({elapsedBefore: elapsed(sp), runningSince:null}); else setSpot({runningSince: Date.now()}); return; }
    case "treset": setSpot({runningSince:null, elapsedBefore:0}); return;
    case "tnext": { const l = ids(); const cur = l.indexOf(app.m.spotlight.uid); setSpot({uid:l[(cur + 1) % l.length], runningSince:null, elapsedBefore:0}); return; }
    case "fbadd": { const txt = $(`#fb-${arg}-text`); if (!txt || !txt.value.trim()) return;
      app.m.feedback.push({id:newId(), to:arg, from:($(`#fb-${arg}-from`)||{}).value || null, tag:$(`#fb-${arg}-tag`).value, text:txt.value.trim().slice(0,600)});
      save(); render(); return; }
    case "fbdel": app.m.feedback = app.m.feedback.filter(f => f.id !== arg); save(); render(); return;
    case "stepadd": { const m = app.m.members[arg]; const steps = (m.steps||[]).map(s => Object.assign({}, s)); steps.push({t:"",done:false}); patchMember(arg, {steps}, false); render();
      const el = document.getElementById(`st-${arg}-${steps.length-1}`); if (el) el.focus(); return; }
    case "stepdel": { const [id, i] = arg.split("|"); const steps = (app.m.members[id].steps||[]).map(s => Object.assign({}, s)); steps.splice(Number(i),1); if (!steps.length) steps.push({t:"",done:false}); patchMember(id, {steps}, true); return; }
    case "resetsteps": patchMember(arg, {rSteps:null}, true); return;
    case "submitted": { const m = app.m.members[arg]; patchMember(arg, {submitted: !m.submitted}, true); if (!m.submitted) toast(`${m.name} is marked as submitted`); return; }
    case "addmember": { const inp = $("#addname"); const n = inp && inp.value.trim(); if (!n) return; const nm = newMember(n.slice(0,60));
      app.m.members[nm.id] = nm; app.m.order.push(nm.id); save(); render(); $("#addname").focus(); return; }
    case "rmmember": { const m = app.m.members[arg]; if (!m) return;
      if (!confirmRemove.pending || confirmRemove.pending !== arg){ confirmRemove.pending = arg; toast(`Click ✕ again to remove ${m.name}`); setTimeout(()=>{ confirmRemove.pending = null; }, 3000); return; }
      confirmRemove.pending = null; delete app.m.members[arg]; app.m.order = app.m.order.filter(x => x !== arg);
      for (const k in app.m.roles) if (app.m.roles[k] === arg) app.m.roles[k] = null;
      if (app.m.spotlight.uid === arg) app.m.spotlight = {uid:null, runningSince:null, elapsedBefore:0};
      save(); render(); return; }
    case "copyel": { const t = document.getElementById(arg); if (t) copy(t.value); return; }
    case "copyall": copy(allAnswers(app.m.members[app.actingAs])); return;
  }
}
const confirmRemove = {pending:null};

/* ---------- Boot: resume a meeting left open on this computer ---------- */
(function boot(){
  const saved = ls.get(STORE_KEY);
  if (saved && saved.members && saved.order){ app.m = saved; app.actingAs = saved.order[0]; }
  render();})();
</script>

</body>
</html>
